name: Deploy Flutter Geometry Runner App to Google Play Internal Testing

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.32.2
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Setup Android NDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install required NDK
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "ndk;27.0.12077973"

      - name: Increment version code
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}')

          VERSION_NAME=$(echo "$VERSION" | cut -d'+' -f1)
          CURRENT_BUILD=$(echo "$VERSION" | cut -d'+' -f2)

          NEXT_BUILD=$((CURRENT_BUILD + 1))

          echo "Current version: $VERSION_NAME+$CURRENT_BUILD"
          echo "New version: $VERSION_NAME+$NEXT_BUILD"

          sed -i "s/^version:.*/version: ${VERSION_NAME}+${NEXT_BUILD}/" pubspec.yaml

      - name: Restore keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/app/upload-keystore.jks

      - name: Create key.properties
        run: |
          cat > android/key.properties <<EOF
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          storeFile=upload-keystore.jks
          EOF

      - name: Build AAB
        run: flutter build appbundle --release

      - name: Upload to Google Play Internal Testing
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.geometry_runner
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          tracks: internal
          status: completed
      
      - name: Commit version code
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add pubspec.yaml
          git commit -m "ci: increment Android version code [skip ci]"
          git push